name: Docker Build and Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Necesitamos permiso de escritura en packages para publicar a ghcr.io
permissions:
  contents: read
  packages: write

env:
  # ghcr.io = GitHub Container Registry
  REGISTRY: ghcr.io
  # El nombre de la imagen será ghcr.io/tu-usuario/tu-repo
  # github.repository ya es "usuario/repo" en minúsculas
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # ── Login al registry ──
      # Usa el GITHUB_TOKEN automático — no necesitas crear secrets
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Generar metadata y tags automáticamente ──
      # Esta action genera tags inteligentes según el contexto
      - name: Extraer metadata (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=1.0.${{ github.run_number }}

      # ── Setup de Buildx ──
      # Buildx es el constructor avanzado de Docker, necesario para
      # features como cache de capas en el registry
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Construir y publicar ──
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          # Contexto: dónde está el Dockerfile
          context: ./QuoteApi
          file: ./QuoteApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de capas usando GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Mostrar las imágenes publicadas ──
      - name: Resumen
        run: |
          echo "### Imágenes publicadas" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"